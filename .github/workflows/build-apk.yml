
name: Build NFT BATTLE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V35_22_ASCENSION.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -tq "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V35.22 project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V35_22_ASCENSION.zip"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::V35.22 ZIP not found"
            exit 1
          fi

          unzip -tq "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-battle-source"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$BASE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Clean and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not created"
            exit 1
          fi

          echo "Checking APK archive..."
          unzip -t "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n1)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p "$RUNNER_TEMP/nft-battle-apk"

          cp "$APK" \
            "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-debug.apk"

          echo "Checking copied APK..."
          unzip -t \
            "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-debug.apk"

          "$APKSIGNER" verify \
            "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-debug.apk"

          sha256sum \
            "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-debug.apk"

          ls -lh "$RUNNER_TEMP/nft-battle-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-debug.apk
          if-no-files-found: error
          retention-days: 7
