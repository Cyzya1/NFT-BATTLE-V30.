name: Build NFT BATTLE V35.16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V35_16_FULL_REPAIR.zip"
      - ".github/workflows/build-apk-v35_16.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK V35.16
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Do not enable setup-java Gradle caching here: the repository contains
          # the Android project inside a ZIP, so no Gradle files exist at checkout time.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install and verify Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9.zip"
          unzip -tq "$RUNNER_TEMP/gradle-8.9.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Validate source archive and extract project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V35_16_FULL_REPAIR.zip"
          test -s "$ARCHIVE" || { echo "::error::V35.16 source ZIP is missing from repository root"; exit 1; }
          unzip -tq "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"
          PROJECT_DIR="$RUNNER_TEMP/nft-battle-source/NFT_BATTLE_Android_Project"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/google-services.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check "$PROJECT_DIR/functions/index.js"
          python - <<'PY'
          import os, re
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          html = (project / "app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.S | re.I)
          blocks = [b for b in blocks if b.strip()]
          if not blocks:
              raise SystemExit("No inline JavaScript found")
          out = Path(os.environ["RUNNER_TEMP"]) / "nft-inline-js"
          out.mkdir(parents=True, exist_ok=True)
          for i, code in enumerate(blocks):
              (out / f"script-{i}.js").write_text(code, encoding="utf-8")
          print(f"Prepared {len(blocks)} inline JavaScript blocks")
          PY
          while IFS= read -r SCRIPT; do node --check "$SCRIPT"; done < <(find "$RUNNER_TEMP/nft-inline-js" -type f -name '*.js' -print)

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify APK before publishing
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::Gradle did not produce app-debug.apk"; exit 1; }
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p "$RUNNER_TEMP/nft-battle-v3516"
          cp "$APK" "$RUNNER_TEMP/nft-battle-v3516/NFT-BATTLE-V35.16-debug.apk"
          sha256sum "$RUNNER_TEMP/nft-battle-v3516/NFT-BATTLE-V35.16-debug.apk" > "$RUNNER_TEMP/nft-battle-v3516/SHA256SUMS.txt"
          unzip -tq "$RUNNER_TEMP/nft-battle-v3516/NFT-BATTLE-V35.16-debug.apk"

      - name: Upload verified APK without recompressing it
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V35.16-VERIFIED-APK
          path: |
            ${{ runner.temp }}/nft-battle-v3516/NFT-BATTLE-V35.16-debug.apk
            ${{ runner.temp }}/nft-battle-v3516/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
