
name: Build NFT BATTLE V34 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_BIG_UPDATE_V34.zip"
      - ".github/workflows/build-apk-v34.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V34
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V34 project
        run: |
          unzip -oq NFT_BATTLE_BIG_UPDATE_V34.zip -d "$RUNNER_TEMP/nft-battle-source"

      - name: Locate Android project
        run: |
          BASE="$RUNNER_TEMP/nft-battle-source"
          PROJECT=""
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$BASE" -type f \( -name settings.gradle -o -name settings.gradle.kts \))
          test -n "$PROJECT" || { echo "Android project not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build V34 debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APK
        run: |
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -s "$APK" || { echo "APK was not created"; exit 1; }
          mkdir -p "$RUNNER_TEMP/nft-battle-apk"
          cp "$APK" "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V34-debug.apk"

      - name: Upload V34 APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V34-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-V34-debug.apk
          if-no-files-found: error
          retention-days: 7
