
name: Build NFT BATTLE V31 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_BIG_UPDATE_V31.zip"
      - ".github/workflows/build-apk-v31.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V31
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V31 project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_BIG_UPDATE_V31.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::V31 ZIP not found in repository root"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-battle-source"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$BASE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android Gradle project not found in V31 ZIP"
            find "$BASE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \
                 -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Build V31 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not created"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-battle-apk"
          cp "$APK" "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V31-debug.apk"
          ls -lh "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V31-debug.apk"

      - name: Upload V31 APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V31-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-V31-debug.apk
          if-no-files-found: error
          retention-days: 7

