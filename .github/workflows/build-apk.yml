
name: Build NFT BATTLE V34 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V34_WITH_SOCIAL_LINKS.zip"
      - ".github/workflows/build-apk-v34.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V34
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V34 project
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/NFT_BATTLE_V34_WITH_SOCIAL_LINKS.zip"
          test -s "$BUNDLE" || { echo "::error::V34 ZIP not found"; exit 1; }

          mkdir -p "$RUNNER_TEMP/nft-bundle" "$RUNNER_TEMP/nft-source"
          unzip -oq "$BUNDLE" -d "$RUNNER_TEMP/nft-bundle"

          ARCHIVE="$(find "$RUNNER_TEMP/nft-bundle" -type f -name 'NFT_BATTLE_BIG_UPDATE_V34.zip' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::NFT_BATTLE_BIG_UPDATE_V34.zip not found inside bundle"
            find "$RUNNER_TEMP/nft-bundle" -maxdepth 5 -type f -print
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-source"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-source"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$BASE" -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found"
            find "$BASE" -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build V34 APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -s "$APK" || { echo "::error::APK not created"; exit 1; }

          mkdir -p "$RUNNER_TEMP/nft-apk"
          cp "$APK" "$RUNNER_TEMP/nft-apk/NFT-BATTLE-V34-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V34-APK
          path: ${{ runner.temp }}/nft-apk/NFT-BATTLE-V34-debug.apk
          if-no-files-found: error
          retention-days: 7
