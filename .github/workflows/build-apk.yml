name: Build NFT BATTLE V31 Firebase APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_BIG_UPDATE_V31_FIREBASE.zip"
      - ".github/workflows/build-apk-v31.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V31 Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V31 Firebase project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_BIG_UPDATE_V31_FIREBASE.zip"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::ZIP not found or empty: NFT_BATTLE_BIG_UPDATE_V31_FIREBASE.zip"
            echo "Files in repository root:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-battle-source"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$BASE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android Gradle project not found in V31 Firebase ZIP"
            find "$BASE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \
                 -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT"

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$PROJECT_DIR/app/google-services.json" ]]; then
            echo "::error::app/google-services.json is missing or empty"
            exit 1
          fi
          if ! grep -q '"project_id"[[:space:]]*:[[:space:]]*"nft-battle-v31"' "$PROJECT_DIR/app/google-services.json"; then
            echo "::error::google-services.json does not target nft-battle-v31"
            exit 1
          fi
          echo "Firebase configuration file found for nft-battle-v31"

      - name: Build V31 Firebase debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not created"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-battle-apk"
          cp "$APK" "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V31-FIREBASE-debug.apk"
          ls -lh "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V31-FIREBASE-debug.apk"

      - name: Upload V31 Firebase APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V31-FIREBASE-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-V31-FIREBASE-debug.apk
          if-no-files-found: error
          retention-days: 7
