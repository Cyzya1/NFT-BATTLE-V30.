
name: Build NFT BATTLE V37 REAL ASSETS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V37_REAL_ASSETS.zip"
      - ".github/workflows/build-apk-v37.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V37
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V37 assets
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V37_REAL_ASSETS.zip"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::V37 ZIP not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          unzip -tq "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/nft-battle-v37"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-v37"

      - name: Extract Android base project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V35_36_BOTTOM_POINTER.zip"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Android base project ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-battle-base"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-base"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-battle-base"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$BASE" -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Apply V37 assets
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$RUNNER_TEMP/nft-battle-v37/app/src/main/assets"
          TARGET="$PROJECT_DIR/app/src/main/assets"

          test -s "$SOURCE/index.html"
          test -s "$SOURCE/cutout.css"
          test -s "$SOURCE/cutout.js"
          test -d "$SOURCE/cast"

          mkdir -p "$TARGET"
          cp -a "$SOURCE/." "$TARGET/"

          echo "V37 assets applied successfully"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not created"
            exit 1
          fi

          unzip -tq "$APK"

          mkdir -p "$RUNNER_TEMP/nft-battle-apk"
          cp "$APK" "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V37-REAL-ASSETS-debug.apk"

          ls -lh "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V37-REAL-ASSETS-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V37-REAL-ASSETS-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-V37-REAL-ASSETS-debug.apk
          if-no-files-found: error
          retention-days: 7
