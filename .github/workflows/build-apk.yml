name: Build NFT BATTLE V34 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V34_2_WEB_APP_ID.zip"
      - ".github/workflows/build-apk-v34.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V34
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract ZIP and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$GITHUB_WORKSPACE/NFT_BATTLE_V34_2_WEB_APP_ID.zip"
          BASE="$RUNNER_TEMP/nft-source"

          test -s "$BUNDLE" || {
            echo "::error::NFT_BATTLE_V34_2_WEB_APP_ID.zip not found"
            exit 1
          }

          mkdir -p "$BASE"
          unzip -oq "$BUNDLE" -d "$BASE"

          # Extract nested ZIP archives
          for ROUND in 1 2 3; do
            FOUND=0

            while IFS= read -r -d '' ARCHIVE; do
              DEST="${ARCHIVE%.zip}_extracted"

              if [ ! -d "$DEST" ]; then
                mkdir -p "$DEST"
                unzip -oq "$ARCHIVE" -d "$DEST"
                FOUND=1
              fi
            done < <(find "$BASE" -type f -iname '*.zip' -print0)

            [ "$FOUND" -eq 1 ] || break
          done

          # Locate Android project
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$BASE" -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found in ZIP"
            echo "Archive contents:"
            find "$BASE" -maxdepth 7 -type f | head -200
            exit 1
          fi

          echo "Android project found: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build V34 debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK was not created"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nft-apk"
          cp "$APK" "$RUNNER_TEMP/nft-apk/NFT-BATTLE-V34-debug.apk"

      - name: Upload V34 APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V34-APK
          path: ${{ runner.temp }}/nft-apk/NFT-BATTLE-V34-debug.apk
          if-no-files-found: error
          retention-days: 7
