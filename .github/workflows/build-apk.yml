name: NFT BATTLE V35.20 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or unpack project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" ]]; then
            ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V35_20_OPTIMIZED.zip"
            test -s "$ARCHIVE" || { echo 'Не найден проект и NFT_BATTLE_V35_20_OPTIMIZED.zip.'; exit 1; }
            mkdir -p "$RUNNER_TEMP/nft-battle-source"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"
            PROJECT_DIR="$(find "$RUNNER_TEMP/nft-battle-source" -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          fi
          test -n "$PROJECT_DIR" || { echo 'settings.gradle не найден.'; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo 'Не найден app/build.gradle.'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          if command -v apksigner >/dev/null 2>&1; then apksigner verify "$APK"; fi
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V35.20-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
