name: Build NFT BATTLE V34.12 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_V34_12_CLAN_500B.zip"
      - ".github/workflows/build-apk-v34_12.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V34.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Extract V34.12 project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_V34_12_CLAN_500B.zip"
          test -s "$ARCHIVE" || { echo "::error::V34.12 project ZIP not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/nft-battle-source"
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/nft-battle-source"
          PROJECT_DIR=""
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then PROJECT_DIR="$DIR"; break; fi
          done < <(find "$BASE" -type f \( -name settings.gradle -o -name settings.gradle.kts \))
          test -n "$PROJECT_DIR" || { echo "::error::Android Gradle project not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -s "$APK" || { echo "::error::Gradle did not produce APK"; exit 1; }
          mkdir -p "$RUNNER_TEMP/nft-battle-apk"
          cp "$APK" "$RUNNER_TEMP/nft-battle-apk/NFT-BATTLE-V34.12-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V34.12-APK
          path: ${{ runner.temp }}/nft-battle-apk/NFT-BATTLE-V34.12-debug.apk
          if-no-files-found: error
          retention-days: 7
